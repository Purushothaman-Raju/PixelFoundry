<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

    <!-- Center Pivot -->
    <circle cx="32" cy="32" r="5" fill="#FFFFFF"></circle>


    <!-- X Axis -->
    <line x1="32" y1="32" x2="55" y2="32" stroke="#E53935" stroke-width="4"></line>

    <polygon points="55,27 63,32 55,37" fill="#E53935"></polygon>


    <!-- Y Axis -->
    <line x1="32" y1="32" x2="32" y2="9" stroke="#43A047" stroke-width="4"></line>

    <polygon points="27,9 32,1 37,9" fill="#43A047"></polygon>


    <!-- Z Axis -->
    <line x1="32" y1="32" x2="15" y2="49" stroke="#1E88E5" stroke-width="4"></line>

    <polygon points="15,43 9,55 21,49" fill="#1E88E5"></polygon>


    <!-- Pivot Editing Ring -->
    <circle cx="32" cy="32" r="13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"></circle>

</svg>